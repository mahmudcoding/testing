<title>Reproducer</title>
<style>
/* Detail pane only. The sidebar, toolbar and verdict control are real AppKit —
   see macapp/Bench.swift. This document styles content, not chrome. */
:root{
  color-scheme:light dark;
  --content:#ffffff; --raised:#f2f2f5;
  --label:#000000; --label-2:#3c3c4399; --label-3:#3c3c434d;
  --accent:#0066cc; --accent-fill:#0a84ff;
  --ok:#1d7f4e; --no:#c0392f; --no-bg:#fceceb;
  --btn:linear-gradient(#ffffff,#f7f7f8); --btn-line:#c8c8cc;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --content:#1e1e1e; --raised:#2e2e31;
  --label:#ffffff; --label-2:#ebebf599; --label-3:#ebebf54d;
  --accent:#4da3ff; --accent-fill:#0a84ff;
  --ok:#4cd18c; --no:#ff6961; --no-bg:#33191b;
  --btn:linear-gradient(#4a4a4e,#414145); --btn-line:#5a5a5f;
}}

*{box-sizing:border-box}
/* when the Reproduce button is removed from the DOM mid-run, WebKit moves focus
   to the block that replaced it and draws a ring round it */
.act, .act *{outline:none}
html,body{height:100%}
body{margin:0;background:var(--content);color:var(--label);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;overflow-y:auto}
button{font:inherit;color:inherit;margin:0}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--label-3);border-radius:6px;
  border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.pane{max-width:660px;padding:22px 30px 34px}
.empty{max-width:420px;margin:20vh auto;text-align:center;color:var(--label-2);
  line-height:1.6}

.crumb{display:flex;align-items:center;gap:6px;margin-bottom:8px;
  font-size:11px;color:var(--label-2)}
.crumb .n{margin-left:auto;font-variant-numeric:tabular-nums}
.tag{padding:2px 6px;border-radius:4px;background:var(--raised);
  font-size:11px;color:var(--label-2)}
.tag.Critical,.tag.High{background:var(--no-bg);color:var(--no)}
h1{margin:0 0 20px;font:600 22px/1.24 inherit;letter-spacing:-.014em;text-wrap:balance}

/* one box on the page, and it is the one holding a control */
/* no container: the highlighted row is the only thing that should draw the eye,
   and every other section on this page is plain prose under a label */

.now-cap{font:600 10.5px/1.3 inherit;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px}
.now{margin:0;font:600 17px/1.35 inherit;letter-spacing:-.008em}

.donelist{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dl-cap{font:600 10.5px/1.3 inherit;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label-3);margin-bottom:2px}
.dl-row{display:flex;gap:7px;align-items:flex-start;line-height:1.45;
  padding:5px 8px;margin:0 -8px;border-radius:6px}
.donelist.live{gap:2px;max-width:62ch}
.dl-row.pending{color:var(--label-3)}
.dl-row.doing{color:var(--label)}
/* one fixed box for every marker: the glyphs are different widths, so letting
   them size themselves shifted the step text sideways when the state changed */
.mk{flex:none;width:14px;display:inline-flex;align-items:center;justify-content:center;
  align-self:flex-start;height:calc(13px * 1.45);color:var(--label-3)}
.dl-row.done .mk{color:var(--ok);font-weight:700}
.dl-row.mine .mk{color:var(--accent);font-weight:700}
.dl-row.mine{color:var(--label);font-weight:600;animation:handoff .3s ease-out}
/* fade only: a translate here was itself the sideways nudge on the row */
@keyframes handoff{from{opacity:.45}to{opacity:1}}
.spinner.sm{width:10px;height:10px;border-width:1.6px;flex:none}
.spinner{display:inline-block;width:12px;height:12px;vertical-align:-1px;
  border:2px solid var(--label-3);border-top-color:var(--accent-fill);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* prose sections: label + text, spacing instead of chrome */
.sec{margin-bottom:22px}
.sec > .cap{font:600 10.5px/1.3 inherit;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label-3);margin-bottom:6px}
.sec p{margin:0;font-size:13.5px;line-height:1.58;max-width:62ch}
.sec.bad p{color:var(--label)}


.note-box{background:var(--no-bg);border-radius:8px;padding:11px 14px;
  margin-bottom:22px;font-size:12.5px;line-height:1.5;max-width:62ch}
.note-box b{display:block;font-weight:600;margin-bottom:3px}

code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;
  background:var(--raised);padding:.1em .35em;border-radius:4px}
</style>

<div class="pane" id="main"><div class="empty">Loading…</div></div>

<script>
let F=[], lane=null, cur=0, Q=[], R={}, RUN={}, LIVE={}, HANDOFF={};
const TILE_LEFT=640;          // points this window keeps; the rig takes the rest
const KEY='aloqa-bench-v1'; let V={};
try{ V=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
const store=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(V)); }catch(e){} };
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const rich=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const short=t=>t.replace(/^(\[[^\]]+\])+\s*/,'');
// reports shout the area tag; macOS chrome does not
const sentence=t=>(t||'').replace(/[A-Za-z][A-Za-z-]*/g,
  w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
const key=f=>f.accounts.join('+')+'|'+f.surface;

const inLane=()=>{const rs=F.filter(f=>f.lane===lane),g={};
  rs.forEach(f=>(g[key(f)]=g[key(f)]||[]).push(f));
  return Object.values(g).sort((a,b)=>a[0].accounts.join().localeCompare(b[0].accounts.join())
    ||b.length-a.length).flat();};

/* Which beat of arm -> look -> judge this finding is on. The pane and the
   native toolbar are both a function of this, so the live step is unambiguous. */
function beat(f){
  if(!f) return 'idle';
  if(RUN[f.id]) return 'running';
  const r=R[f.id];
  if(r&&!r.ok) return 'failed';
  if(r) return 'ready';
  return V[f.id]&&V[f.id].v ? 'judged' : 'idle';
}

/* Everything AppKit needs to keep the sidebar and toolbar in step. */
function sync(){
  const f=Q[cur];
  window.webkit?.messageHandlers?.app?.postMessage({
    rows:Q.map(x=>({id:x.id,title:short(x.title),verdict:(V[x.id]||{}).v||''})),
    cur, beat:beat(f), verdict:f?((V[f.id]||{}).v||''):'',
    canClose: !!(f && R[f.id] && !RUN[f.id] && !CLOSING),
    lane:f?f.laneName:''
  });
}

/* The steps are the only place run state is shown, and they never move: the
   same list sits under the finding from the moment it opens, and pressing
   Reproduce fills it in. Nothing is added or removed, so nothing shifts. */
function stepRows(f){
  const b=beat(f), r=R[f.id];
  const n = b==='ready' ? Math.min(r.stepsDone||0, f.steps.length)
          : b==='running' ? (LIVE[f.id]||0) : 0;
  const mineIdx = b==='ready' && HANDOFF[f.id] && n < f.steps.length ? n : -1;
  return f.steps.map((x,i)=>{
    const st = i<n ? 'done' : (i===mineIdx ? 'mine'
             : (b==='running' && i===n ? 'doing' : 'pending'));
    const mark = st==='doing' ? '<span class="mk"><span class="spinner sm"></span></span>'
               : `<span class="mk">${st==='done' ? '✓' : st==='mine' ? '▸' : '○'}</span>`;
    return `<div class="dl-row ${st}">${mark}<span>${rich(x)}</span></div>`;
  }).join('');
}

function render(){
  const el=document.getElementById('main');
  if(!Q.length){el.innerHTML='<div class="empty">Nothing to verify.<br><br>'
    +'Reproducer carries only findings with a repro script in '
    +'<code>scripts/callrig/snip/</code>. Add a <code>data-snippet</code> repro block '
    +'to a report and it shows up here.</div>';sync();return;}
  cur=Math.max(0,Math.min(cur,Q.length-1));
  const f=Q[cur], rec=V[f.id]||{}, b=beat(f);
  const warns=[...(f.notes||[]).map(n=>['Check the fixture first',n]),
    ...(f.drift?[['The report contradicts itself','Its own summary row reads: “'+f.drift+'”']]:[])];

  el.innerHTML=`
    <div class="crumb">
      <span class="tag ${f.sev==='?'?'':f.sev}">${f.sev==='?'?'Unrated':f.sev}</span>
      <span class="tag">${esc(sentence(f.area))}</span>
      <span>${esc(f.laneName)}</span>
      <span class="n">${cur+1} of ${Q.length}</span>
    </div>
    <h1>${rich(short(f.title))}</h1>
    ${warns.map(w=>`<div class="note-box"><b>${esc(w[0])}</b>${rich(w[1])}</div>`).join('')}
    ${b==='failed'?`<div class="note-box"><b>Setup failed</b>${
      rich((R[f.id]||{}).left||'The script did not finish.')}</div>`:''}
    ${f.actual?`<div class="sec bad"><div class="cap">Reported</div>
      <p>${rich(f.actual)}</p></div>`:''}
    ${f.expected?`<div class="sec"><div class="cap">Should be</div>
      <p>${rich(f.expected)}</p></div>`:''}
    ${f.steps.length?`<div class="sec"><div class="cap">Steps</div>
      <div class="donelist live">${stepRows(f)}</div></div>`:''}

`;

  // #play is re-created by every render, so it is re-bound by every render
  const c=document.getElementById('copylog');
  if(c)c.onclick=()=>{navigator.clipboard.writeText((R[f.id]||{}).log||'');
    c.textContent='Copied'; setTimeout(()=>{c.textContent='Copy details';},1600);};
  document.documentElement.scrollTop=0;
  sync();
}

async function watchProgress(f){
  while(RUN[f.id]){
    try{
      const r=await fetch('/api/progress?id='+encodeURIComponent(f.id));
      const j=await r.json();
      if((j.steps||0)!==LIVE[f.id]){ LIVE[f.id]=j.steps||0; if(Q[cur]===f) render(); }
    }catch(e){}
    await new Promise(r=>setTimeout(r,350));
  }
}

async function doRepro(){
  const f=Q[cur]; if(!f||RUN[f.id])return;
  RUN[f.id]=true; LIVE[f.id]=0; delete R[f.id]; delete HANDOFF[f.id]; render();
  // clear the screen for the run: this window left, the rig window right
  window.webkit?.messageHandlers?.app?.postMessage({cmd:'tile', width:TILE_LEFT});
  watchProgress(f);
  try{
    const r=await fetch('/api/repro',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:f.id})});
    R[f.id]=await r.json();
  }catch(e){ R[f.id]={ok:false,stage:'failed',log:String(e),
    left:'Could not reach the rig. Is scripts/bench.py still running?'}; }
  delete RUN[f.id]; render();
  // let the script's final tick be seen on its own before the row becomes the
  // person's to act on -- both changing in one frame reads as a glitch
  setTimeout(()=>{ HANDOFF[f.id]=true; if(Q[cur]===f) render(); }, 650);
}

function verdict(v){
  const f=Q[cur]; if(!f)return;
  const n=document.getElementById('note');
  V[f.id]={v,note:n?n.value.trim():'',at:new Date().toISOString()};
  store(); if(cur<Q.length-1)cur++; render();
}

let CLOSING=false;
async function closeBrowser(f){
  if(!f || CLOSING) return;
  CLOSING=true; sync();
  try{
    const r=await fetch('/api/close',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lane:f.lane})});
    const j=await r.json();
    // the run is over and its browser is gone, so the card goes back to
    // offering the only thing that makes sense now: running it again
    if(j.ok){ delete R[f.id]; delete LIVE[f.id]; }
  }catch(e){}
  CLOSING=false; render();
}

async function saveRecord(){
  const L=[...new Set(F.map(f=>f.lane))], out=['# Human verification record','',
    `_${new Date().toLocaleString()}_`,''];
  L.forEach(x=>{const rs=F.filter(f=>f.lane===x&&V[f.id]&&V[f.id].v); if(!rs.length)return;
    out.push(`## Lane ${x} — ${rs[0].laneName}`,'');
    rs.forEach(f=>{const r=V[f.id];
      out.push(`- **${({y:'CONFIRMED',n:'NOT A BUG',s:'SKIPPED'})[r.v]}** · [${f.sev}] ${f.title}`);
      if(r.note)out.push(`  - ${r.note}`);}); out.push('');});
  const res=await fetch('/api/record',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({md:out.join('\n')})});
  const j=await res.json();
  window.webkit?.messageHandlers?.app?.postMessage({cmd:'saved', path:j.path||''});
}

// called from AppKit
window.__select=i=>{cur=i;render();};
window.__repro=doRepro;
window.__verdict=verdict;
window.__save=saveRecord;
window.__close=()=>closeBrowser(Q[cur]);

addEventListener('keydown',e=>{
  // Cmd+R must stay Reload and Cmd+S must not mark the finding skipped:
  // a bare letter is a shortcut, the same letter under a modifier is not ours.
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target.tagName==='INPUT'||e.target.isContentEditable){
    if(e.key==='Escape')e.target.blur(); return;}
  const k=e.key.toLowerCase();
  if(k==='r'){doRepro();e.preventDefault();}
  else if('yns'.includes(k)){verdict(k);e.preventDefault();}
});

fetch('/api/findings').then(r=>r.json()).then(d=>{
  F=d; lane=F.length?F[0].lane:null; Q=inLane(); render();
}).catch(e=>{document.getElementById('main').innerHTML=
  '<div class="empty">Could not load findings — is scripts/bench.py running?</div>';});
</script>
